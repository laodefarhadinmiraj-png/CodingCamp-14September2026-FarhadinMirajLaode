<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Expense &amp; Budget Visualizer</h1>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span id="themeIcon">🌙</span>
      </button>
    </header>

    <!-- TOTAL BALANCE -->
    <section class="card balance-card" id="balanceCard">
      <p class="balance-label">TOTAL BALANCE</p>
      <p class="balance-amount" id="balanceAmount">Rp0</p>

      <div class="limit-row">
        <label for="limitInput">Set spending limit (optional)</label>
        <input type="number" id="limitInput" min="0" step="1000" placeholder="misal: 500000" />
      </div>
      <p class="limit-warning" id="limitWarning" hidden>⚠️ You've exceeded your spending limit!</p>
    </section>

    <!-- ADD TRANSACTION FORM -->
    <section class="card form-card">
      <h2>Add Transaction</h2>
      <form id="transactionForm" novalidate>
        <div class="field">
          <label for="itemName">Item Name</label>
          <input type="text" id="itemName" name="itemName" placeholder="misal: Cilok" autocomplete="off" />
          <span class="error-text" id="itemNameError"></span>
        </div>

        <div class="field">
          <label for="amount">Amount (Rp)</label>
          <input type="number" id="amount" name="amount" min="0" step="500" placeholder="misal: 15000" />
          <span class="error-text" id="amountError"></span>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="" disabled selected>Select category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="error-text" id="categoryError"></span>
        </div>

        <button type="submit" class="btn-primary">Add Transaction</button>
      </form>
    </section>

    <!-- TRANSACTIONS + CHART -->
    <section class="grid-2">
      <div class="card transactions-card">
        <div class="card-header-row">
          <h2>Transactions</h2>
          <select id="sortSelect" class="sort-select" aria-label="Sort transactions">
            <option value="newest">Newest</option>
            <option value="amountDesc">Amount (High → Low)</option>
            <option value="amountAsc">Amount (Low → High)</option>
            <option value="category">Category (A → Z)</option>
          </select>
        </div>
        <ul id="transactionList" class="transaction-list">
          <li class="empty-state" id="emptyState">No transactions yet. Add one above!</li>
        </ul>
      </div>

      <div class="card chart-card">
        <h2>Spending by Category</h2>
        <div class="chart-wrapper">
          <canvas id="spendingChart" aria-label="Pie chart of spending by category" role="img"></canvas>
        </div>
        <p class="chart-empty" id="chartEmpty">No data to display yet.</p>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
